global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mini-commerce-api
    metrics_path: /actuator/prometheus
    static_configs:
      # Docker Desktop: host.docker.internal generally reaches the host.
      # Linux Compose includes host-gateway in compose.yaml.
      - targets: ["host.docker.internal:8080"]
