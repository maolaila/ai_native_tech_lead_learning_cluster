# 作用：把同一个商城需要的数据库、缓存、消息队列和应用一起启动。
# 为什么：容器之间使用下面的服务名连接；你的电脑访问的是 ports 左侧端口。
# 对应文档：08_runtime_deployment/02_Compose_Network_Volume_Health.md、mini-commerce/docs/LEARNING-READINESS.md。
# profiles 是可选分组：app 启动后端和 MCP，observability 启动监控。
# volumes 保存持久数据；down 不删数据，down -v 会删数据，学习时不要随手加 -v。
name: mini-commerce
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
      MCP_DATABASE_PASSWORD: ${MCP_DATABASE_PASSWORD:-commerce-readonly-local}
      TZ: UTC
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-readonly.sh:/docker-entrypoint-initdb.d/10-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce_app} -d ${POSTGRES_DB:-commerce}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [commerce]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [commerce]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commerce-local}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-15672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [commerce]

  backend:
    profiles: [app]
    build: {context: ./backend}
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-commerce}
      DATABASE_USER: ${POSTGRES_USER:-commerce_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-commerce}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-commerce-local}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-Y2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtMzItYnl0ZXMtbWluaW11bQ==}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-secret-change-me}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["127.0.0.1:${BACKEND_PORT:-18080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [commerce]

  mcp-server:
    profiles: [app]
    build: {context: ./mcp-server}
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8081
      MCP_STATIC_TOKEN: ${MCP_STATIC_TOKEN:-local-mcp-readonly-token}
      MCP_PUBLIC_URL: http://localhost:${MCP_PORT:-18081}/mcp
      REPOSITORY_ROOT: /workspace
      DATABASE_READONLY_URL: postgresql://commerce_readonly:${MCP_DATABASE_PASSWORD:-commerce-readonly-local}@postgres:5432/${POSTGRES_DB:-commerce}
      MCP_AUDIT_PATH: /audit/mcp-audit.jsonl
    ports: ["127.0.0.1:${MCP_PORT:-18081}:8081"]
    volumes:
      - ..:/workspace:ro
      - mcp-audit:/audit
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [commerce]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [commerce]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-local
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo]
    networks: [commerce]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [commerce]

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol.yml"]
    volumes: [./infra/observability/otel-collector.yml:/etc/otelcol.yml:ro]
    depends_on: [tempo]
    networks: [commerce]

networks: {commerce: {driver: bridge}}
volumes:
  postgres-data: {}
  redis-data: {}
  rabbitmq-data: {}
  prometheus-data: {}
  grafana-data: {}
  tempo-data: {}
  mcp-audit: {}
