name: Pre-study audit
on:
  push:
    branches: [audit/pre-study-2026-09-07]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pre-study-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/audit/pre-study-2026-09-07' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.2'
      - name: Install tools
        run: python -m pip install 'black==25.1.0' -r requirements-docs.txt -e './mini-commerce/mcp-server[dev]'
      - name: Apply reviewed corrections and synchronize learning assets
        shell: bash
        run: |
          shopt -s nullglob
          for repair in tools/maintenance/pending_pre_study_*.py; do
            python "$repair"
            rm "$repair"
          done
          mvn -B -ntp -f mini-commerce/backend/pom.xml spotless:apply
          python -m black mini-commerce/mcp-server mini-commerce/scripts tools/build_docs_site.py tools/sync_learning_assets.py tools/tests
          git add -A
          python tools/sync_learning_assets.py
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: synchronize reviewed code, beginner guides and inventories'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          mkdir -p /tmp/pre-study
          git rev-parse HEAD > /tmp/pre-study/source-commit.txt
          git archive --format=zip HEAD -o /tmp/pre-study/learning-source.zip
      - name: Verify generated assets are deterministic
        run: |
          python tools/sync_learning_assets.py
          git diff --exit-code
      - name: PostgreSQL regression tests (Docker required)
        run: |
          docker info >/dev/null
          mvn -B -ntp -f mini-commerce/backend/pom.xml verify
      - name: MCP and documentation safety tests
        if: success() || failure()
        run: |
          python -m pytest -q mini-commerce/mcp-server/tests --junitxml=/tmp/pre-study/mcp-tests.xml
          python -m unittest discover -s tools/tests -v
          python mini-commerce/ai-engineering/eval/run_static_eval.py
      - name: Strict documentation build
        if: success() || failure()
        run: python tools/build_docs_site.py --strict --output /tmp/pre-study-site
      - name: Terraform syntax and schema validation (no cloud creation)
        if: success() || failure()
        working-directory: mini-commerce/infra/aws/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly
          terraform validate
      - name: Real Compose startup and HTTP closed loop
        working-directory: mini-commerce
        run: |
          docker compose --profile app --profile observability up -d --build --wait --wait-timeout 240
          python3 scripts/smoke.py | tee /tmp/pre-study/smoke.json
          python3 scripts/check_mcp_http.py
          docker compose exec -T mcp-server python /workspace/mini-commerce/scripts/check_mcp_runtime.py
          curl --fail --silent http://127.0.0.1:18080/actuator/prometheus > /tmp/pre-study/metrics.txt
          grep -q commerce_orders_created /tmp/pre-study/metrics.txt
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(30):
              data=json.load(urllib.request.urlopen('http://127.0.0.1:19090/api/v1/query?query=up',timeout=5))
              if any(x['metric'].get('job')=='mini-commerce' and x['value'][1]=='1' for x in data['data']['result']):
                  print('Prometheus scrape verified'); break
              time.sleep(2)
          else: raise SystemExit('Prometheus did not scrape backend successfully')
          PY
      - name: Save Compose evidence and stop ephemeral CI containers
        if: always()
        working-directory: mini-commerce
        run: |
          mkdir -p /tmp/pre-study
          docker compose ps -a > /tmp/pre-study/compose-status.txt
          docker compose logs --no-color --tail=200 > /tmp/pre-study/compose.log 2>&1
          docker compose --profile app --profile observability down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-study-evidence
          path: |
            /tmp/pre-study/**
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
          retention-days: 14
