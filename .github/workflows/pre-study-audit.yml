name: Pre-study audit
on:
  push:
    branches: [audit/pre-study-2026-09-07]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pre-study-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/audit/pre-study-2026-09-07' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install testing and formatting tools
        run: python -m pip install 'black==25.1.0' -e './mini-commerce/mcp-server[dev]'
      - name: Format reviewed source on audit branch only
        shell: bash
        run: |
          shopt -s nullglob
          for repair in tools/maintenance/pending_pre_study_*.py; do
            python "$repair"
            rm "$repair"
          done
          mvn -B -ntp -f mini-commerce/backend/pom.xml spotless:apply
          python -m black mini-commerce/mcp-server
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format reviewed learning source (validation follows)'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          git rev-parse HEAD > /tmp/source-commit.txt
          git archive --format=zip HEAD -o /tmp/learning-source.zip
      - name: PostgreSQL regression tests (Docker required)
        run: |
          docker info >/dev/null
          mvn -B -ntp -f mini-commerce/backend/pom.xml verify
      - name: MCP security and boundary tests
        if: success() || failure()
        run: python -m pytest -q mini-commerce/mcp-server/tests --junitxml=/tmp/mcp-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-study-backend-evidence
          path: |
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
            mini-commerce/backend/target/site/jacoco/**
            /tmp/mcp-tests.xml
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-source
          path: |
            /tmp/learning-source.zip
            /tmp/source-commit.txt
          retention-days: 7
