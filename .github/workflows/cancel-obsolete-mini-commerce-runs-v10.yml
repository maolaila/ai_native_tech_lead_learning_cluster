name: cancel-obsolete-mini-commerce-runs-v10

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete-mini-commerce-runs-v10.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              if (run.status !== 'queued' && run.status !== 'in_progress') continue;
              core.info(`Cancelling ${run.id}: ${run.name} (${run.status})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                core.warning(`Unable to cancel ${run.id}: ${error.message}`);
              }
            }
