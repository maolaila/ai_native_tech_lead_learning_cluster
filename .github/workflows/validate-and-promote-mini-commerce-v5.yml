name: validate-and-promote-mini-commerce-v5

on:
  push:
    branches: [feat/complete-mini-commerce]
    paths:
      - '.github/workflows/validate-and-promote-mini-commerce-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-complete-mini-commerce
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-mini-commerce
          fetch-depth: 0

      - name: Synchronize feature branch
        run: |
          git fetch origin main feat/complete-mini-commerce
          git reset --hard origin/feat/complete-mini-commerce

      - name: Generate the complete project before reading project lock files
        shell: bash
        run: |
          set -o pipefail
          mkdir -p mini-commerce/build-evidence
          {
            python3 tools/generate_complete_mini_commerce_v2.py
            python3 tools/apply_final_fixes_v2.py
            python3 tools/apply_release_fixes_v2.py
            python3 tools/apply_completeness_fixes_v3.py
            python3 tools/apply_ci_and_docs_fixes_v5.py
            python3 tools/refine_document_mapping_v3.py
          } 2>&1 | tee mini-commerce/build-evidence/generate.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.2'

      - name: Format IaC and finalize current manifests
        shell: bash
        run: |
          set -o pipefail
          {
            terraform fmt -recursive mini-commerce/infra/aws/terraform
            python tools/finalize_delivery_v3.py
          } 2>&1 | tee mini-commerce/build-evidence/finalize.log

      - name: Static integrity, mappings, JSON, YAML and AI Eval
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install 'PyYAML==6.0.2'
            python tools/generate_complete_mini_commerce_v2.py --check
            python mini-commerce/tools/check_learning_references.py
            python mini-commerce/ai-engineering/eval/run_static_eval.py
            python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('mini-commerce').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('valid-json', path)
          for pattern in ('*.yml', '*.yaml'):
              for path in Path('mini-commerce').rglob(pattern):
                  list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
                  print('valid-yaml', path)
          PY
          } 2>&1 | tee mini-commerce/build-evidence/static.log

      - name: MCP security and tool-contract tests
        shell: bash
        working-directory: mini-commerce/mcp-server
        run: |
          set -o pipefail
          {
            python -m pip install -e '.[dev]'
            pytest -q
          } 2>&1 | tee ../build-evidence/mcp.log

      - name: Java compile, unit, architecture and PostgreSQL integration tests
        shell: bash
        working-directory: mini-commerce/backend
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee ../build-evidence/maven.log

      - name: Compose validation and runtime image builds
        shell: bash
        run: |
          set -o pipefail
          {
            docker compose -f mini-commerce/compose.yaml config >mini-commerce/build-evidence/compose-rendered.yml
            docker build -t mini-commerce-backend:${GITHUB_SHA} mini-commerce/backend
            docker build -t mini-commerce-mcp:${GITHUB_SHA} mini-commerce/mcp-server
          } 2>&1 | tee mini-commerce/build-evidence/containers.log

      - name: AWS Terraform formatting and validation
        shell: bash
        working-directory: mini-commerce/infra/aws/terraform
        run: |
          set -o pipefail
          {
            terraform fmt -check -recursive
            terraform init -backend=false
            terraform validate
          } 2>&1 | tee ../../../build-evidence/terraform.log

      - name: Write successful validation evidence
        run: |
          find mini-commerce -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} + || true
          cat > mini-commerce/VALIDATION-REPORT.md <<EOF
          # 完整工程验证报告

          本报告由 GitHub Actions 工作流 \`validate-and-promote-mini-commerce-v5\` 生成。

          - Workflow：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 输入提交：${GITHUB_SHA}
          - Java 21 + Maven compile/unit/ArchUnit：通过
          - Testcontainers PostgreSQL 18 + Flyway + 事务/并发/HTTP 对象权限测试：通过
          - MCP SDK 2.1.1 + 路径/SQL/命令白名单/Prompt Injection 测试：通过
          - Docker Compose 解析、后端与 MCP 镜像构建：通过
          - Terraform fmt/init/validate：通过
          - 文档章节映射、JSON、YAML 与 AI 静态 Eval：通过

          该文件只会在全部步骤成功后生成；随后同一提交才允许快进到 \`main\`。
          EOF
          rm -f mini-commerce/CI-FAILURE-v5.md

      - name: Commit the validated project to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md MANIFEST.md mini-commerce
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish complete validated Mini Commerce project'
          fi
          git push origin HEAD:feat/complete-mini-commerce

      - name: Fast-forward main only after every quality gate succeeds
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Persist a failure report on the feature branch only
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p mini-commerce/build-evidence
          {
            echo '# CI 失败报告（main 未更新）'
            echo
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo '- 结论：至少一个发布门禁失败；main 快进步骤未执行。'
            for file in mini-commerce/build-evidence/*.log; do
              if test -f "$file"; then
                echo
                echo "## $(basename "$file") 最后 200 行"
                echo '```text'
                tail -n 200 "$file"
                echo '```'
              fi
            done
          } > mini-commerce/CI-FAILURE-v5.md
          git add -f mini-commerce/CI-FAILURE-v5.md
          git commit -m 'ci: record failed v5 validation' || true
          git pull --rebase origin feat/complete-mini-commerce || true
          git push origin HEAD:feat/complete-mini-commerce || true

      - name: Upload all available validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-commerce-v5-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            mini-commerce/VALIDATION-REPORT.md
            mini-commerce/CI-FAILURE-v5.md
            mini-commerce/build-evidence/**
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
            mini-commerce/backend/target/site/jacoco/**
