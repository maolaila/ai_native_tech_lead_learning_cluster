name: Beginner-friendly learning quality gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/beginner-friendly-learning
      - feat/complete-mini-commerce
      - main
    paths:
      - "README.md"
      - "SUMMARY.md"
      - "mkdocs.yml"
      - "02_backend_spring/**"
      - "16_references/**"
      - "mini-commerce/README.md"
      - "mini-commerce/docs/**"
      - "mini-commerce/backend/**"
      - "tools/generate_annotation_usage_index.py"
      - "tools/check_beginner_learning_assets.py"
      - "tools/update_beginner_mkdocs_nav.py"
      - "tools/check_learning_readability.py"
      - "tools/check_learning_references.py"
      - ".github/workflows/beginner-learning-ci.yml"

permissions:
  contents: write

concurrency:
  group: beginner-learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Keep beginner navigation in sync
        run: python3 tools/update_beginner_mkdocs_nav.py

      - name: Generate annotation usage index
        run: python3 tools/generate_annotation_usage_index.py

      - name: Format every Java source file
        run: mvn -B -f mini-commerce/backend/pom.xml spotless:apply

      - name: Check Java readability and document mappings
        run: python3 tools/check_learning_readability.py

      - name: Check beginner learning materials
        run: python3 tools/check_beginner_learning_assets.py

      - name: Compile and run unit and architecture tests
        run: mvn -B -f mini-commerce/backend/pom.xml test

      - name: Check learning references
        run: python3 tools/check_learning_references.py

      - name: Build MkDocs site in strict mode
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit generated indexes, navigation and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes are required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            SUMMARY.md \
            mkdocs.yml \
            mini-commerce/README.md \
            mini-commerce/docs \
            mini-commerce/backend \
            tools
          git commit -m "docs: publish beginner-friendly indexes and formatted source"
          git push origin HEAD:${GITHUB_REF_NAME}
