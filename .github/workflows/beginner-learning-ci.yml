name: Beginner-friendly learning quality gate
on:
  push:
    branches: [main, feat/complete-mini-commerce]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beginner-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Check formatting without rewriting source
        run: mvn -B -ntp -f mini-commerce/backend/pom.xml spotless:check
      - name: Verify generated documents and inventories match source
        run: |
          python tools/sync_learning_assets.py
          git diff --exit-code
      - name: Check build output path protections
        run: python -m unittest discover -s tools/tests -v
      - name: Strict MkDocs build from tracked source snapshot
        run: python tools/build_docs_site.py --strict --output /tmp/learning-site
