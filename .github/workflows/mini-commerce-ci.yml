name: mini-commerce-ci

on:
  push:
    branches: [main, feat/complete-mini-commerce]
    paths:
      - 'mini-commerce/**'
      - 'tools/**'
      - '.github/workflows/mini-commerce-ci.yml'
  pull_request:
    paths:
      - 'mini-commerce/**'
      - 'tools/**'
      - '.github/workflows/mini-commerce-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# 显式 Bash 会启用 pipefail；Smoke 失败时不能被后面的 tee 成功掩盖。
defaults:
  run:
    shell: bash

concurrency:
  group: mini-commerce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Validate generated project and document links
        run: |
          python tools/generate_complete_mini_commerce_v2.py --check
          python mini-commerce/tools/check_learning_references.py
          python mini-commerce/ai-engineering/eval/run_static_eval.py
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('mini-commerce').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('valid', path)
          PY

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, unit test, PostgreSQL integration test and architecture test
        working-directory: mini-commerce/backend
        run: |
          docker info >/dev/null
          mvn -B -ntp verify
          python3 ../../tools/check_test_evidence.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          if-no-files-found: warn
          path: |
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
            mini-commerce/backend/target/site/jacoco/**

  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.13', cache: pip, cache-dependency-path: mini-commerce/mcp-server/pyproject.toml}
      - name: Install pinned MCP SDK and tests
        working-directory: mini-commerce/mcp-server
        run: python -m pip install -e '.[dev]'
      - name: Run MCP path, SQL, command allowlist and prompt-injection tests
        working-directory: mini-commerce/mcp-server
        run: pytest -q

  container-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose topology
        working-directory: mini-commerce
        run: docker compose config >/tmp/compose.rendered.yml
      - name: Build backend image
        run: docker build -t mini-commerce-backend:ci mini-commerce/backend
      - name: Build MCP image
        run: docker build -t mini-commerce-mcp:ci mini-commerce/mcp-server
      - name: Run real HTTP, message, monitoring and restore acceptance
        working-directory: mini-commerce
        run: |
          docker compose --profile app --profile observability up -d --build --wait --wait-timeout 240
          python3 scripts/smoke.py | tee /tmp/smoke.json
          python3 scripts/check_mcp_http.py
          docker compose exec -T mcp-server python /workspace/mini-commerce/scripts/check_mcp_runtime.py
          python3 scripts/check_observability.py --output /tmp/observability.json
          DUMP=$(bash scripts/backup.sh)
          bash scripts/restore-test.sh "$DUMP" | tee /tmp/restore.txt
          docker compose exec -T prometheus promtool check rules /etc/prometheus/alerts.yml
      - name: Capture runtime logs and stop CI containers
        if: always()
        working-directory: mini-commerce
        run: |
          docker compose logs --no-color --tail=200 > /tmp/compose.log 2>&1
          docker compose --profile app --profile observability down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-runtime-evidence
          path: |
            /tmp/compose.log
            /tmp/smoke.json
            /tmp/observability.json
            /tmp/restore.txt

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.2'}
      - name: Terraform formatting
        working-directory: mini-commerce/infra/aws/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init without backend
        working-directory: mini-commerce/infra/aws/terraform
        run: terraform init -backend=false -lockfile=readonly
      - name: Terraform validate
        working-directory: mini-commerce/infra/aws/terraform
        run: terraform validate
