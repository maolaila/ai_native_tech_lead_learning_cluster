name: cancel-obsolete-mini-commerce-runs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete-mini-commerce-runs.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel every other queued or in-progress workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });
            const obsolete = runs.filter(run =>
              run.id !== context.runId &&
              (run.status === 'queued' || run.status === 'in_progress')
            );
            core.info(`Cancelling ${obsolete.length} obsolete run(s).`);
            for (const run of obsolete) {
              core.info(`Cancel ${run.id}: ${run.name} (${run.status})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                core.warning(`Unable to cancel ${run.id}: ${error.message}`);
              }
            }
