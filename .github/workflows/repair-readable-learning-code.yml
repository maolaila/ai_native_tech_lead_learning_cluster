name: Repair readable learning code

on:
  workflow_dispatch:
  push:
    branches:
      - fix/readable-learning-code
    paths:
      - "mini-commerce/backend/**"
      - "tools/annotate_learning_code.py"
      - "tools/check_learning_readability.py"
      - ".editorconfig"
      - ".github/workflows/repair-readable-learning-code.yml"

permissions:
  contents: write

concurrency:
  group: readable-learning-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-comment-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml

      - name: Add Chinese learning comments
        run: python3 tools/annotate_learning_code.py

      - name: Format every Java source file
        run: mvn -B -f mini-commerce/backend/pom.xml spotless:apply

      - name: Verify readability and document mappings
        run: python3 tools/check_learning_readability.py

      - name: Compile and run unit tests
        run: mvn -B -f mini-commerce/backend/pom.xml test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit generated formatting and comments
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No readability changes are required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini-commerce/backend tools mini-commerce/docs/generated .editorconfig
          git commit -m "refactor: format all Java and add Chinese learning comments"
          git push origin HEAD:${GITHUB_REF_NAME}
