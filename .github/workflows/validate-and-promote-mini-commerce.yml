name: validate-and-promote-mini-commerce

on:
  push:
    branches: [feat/complete-mini-commerce]
    paths:
      - '.github/workflows/validate-and-promote-mini-commerce.yml'
  workflow_dispatch:

permissions:
  contents: write

# 与旧的生成工作流使用同一并发组，避免两者同时改动功能分支。
concurrency:
  group: generate-complete-mini-commerce
  cancel-in-progress: false

jobs:
  validate-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the complete-project branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-mini-commerce
          fetch-depth: 0

      - name: Synchronize with the latest feature branch
        run: |
          git fetch origin main feat/complete-mini-commerce
          git reset --hard origin/feat/complete-mini-commerce

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mini-commerce/mcp-server/pyproject.toml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.2'

      - name: Generate the full project from the audited scaffold
        run: |
          python tools/generate_complete_mini_commerce_v2.py
          python tools/apply_final_fixes_v2.py
          terraform fmt -recursive mini-commerce/infra/aws/terraform

      - name: Validate generated sources and document-to-code mapping
        run: |
          python tools/generate_complete_mini_commerce_v2.py --check
          python mini-commerce/tools/check_learning_references.py
          python mini-commerce/ai-engineering/eval/run_static_eval.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('mini-commerce').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('valid-json', path)
          PY

      - name: Run MCP security and contract tests
        working-directory: mini-commerce/mcp-server
        run: |
          python -m pip install -e '.[dev]'
          pytest -q

      - name: Compile and test the Spring Boot application
        working-directory: mini-commerce/backend
        run: mvn -B -ntp verify

      - name: Validate Docker Compose and build runtime images
        run: |
          docker compose -f mini-commerce/compose.yaml config >/tmp/mini-commerce-compose.yml
          docker build -t mini-commerce-backend:${GITHUB_SHA} mini-commerce/backend
          docker build -t mini-commerce-mcp:${GITHUB_SHA} mini-commerce/mcp-server

      - name: Validate AWS Terraform
        working-directory: mini-commerce/infra/aws/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Create a truthful validation report
        run: |
          rm -rf mini-commerce/**/__pycache__ mini-commerce/**/.pytest_cache || true
          cat > mini-commerce/VALIDATION-REPORT.md <<EOF
          # 完整工程验证报告

          本报告由 GitHub Actions 工作流 \`validate-and-promote-mini-commerce\` 生成。

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Java: 21
          - Spring Boot/Maven: \`mvn -B -ntp verify\` 通过
          - PostgreSQL: Testcontainers + Flyway 集成/并发测试通过
          - MCP: Python 3.13 + MCP SDK 2.1.1，pytest 通过
          - Docker: Compose 配置解析与后端/MCP 镜像构建通过
          - Terraform: fmt、init、validate 通过
          - 文档映射、JSON、AI 静态 Eval：通过

          只有前述步骤全部成功，工作流才会执行后续的 \`main\` 快进发布。
          EOF

      - name: Commit the generated, formatted and validated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md mini-commerce
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat: publish complete Mini Commerce learning project'
          fi
          git push origin HEAD:feat/complete-mini-commerce

      - name: Fast-forward main only after every quality gate succeeds
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-mini-commerce-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            mini-commerce/VALIDATION-REPORT.md
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
            mini-commerce/backend/target/site/jacoco/**
