name: bootstrap-complete-mini-commerce-v8

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-complete-mini-commerce-v8.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-mini-commerce-final-v8
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-mini-commerce
          fetch-depth: 0

      - name: Merge current main into the feature branch
        run: |
          git fetch origin main feat/complete-mini-commerce
          git reset --hard origin/feat/complete-mini-commerce
          git merge --no-edit origin/main

      - name: Generate complete source and apply all reviewed corrections
        shell: bash
        run: |
          set -o pipefail
          mkdir -p mini-commerce/build-evidence
          {
            python3 tools/generate_complete_mini_commerce_v2.py
            python3 tools/apply_final_fixes_v2.py
            python3 tools/apply_release_fixes_v2.py
            python3 tools/apply_completeness_fixes_v3.py
            python3 tools/apply_ci_and_docs_fixes_v5.py
            python3 tools/apply_runtime_and_gate_fixes_v6.py
            python3 tools/apply_release_cleanup_v7.py
            python3 tools/refine_document_mapping_v3.py
            rm -f .github/workflows/bootstrap-complete-mini-commerce-v7.yml
            rm -f .github/workflows/bootstrap-complete-mini-commerce-v8.yml
          } 2>&1 | tee mini-commerce/build-evidence/generate.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mini-commerce/backend/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.2'

      - name: Format IaC and create pre-validation manifests
        shell: bash
        run: |
          set -o pipefail
          {
            terraform fmt -recursive mini-commerce/infra/aws/terraform
            python tools/finalize_delivery_v7.py
          } 2>&1 | tee mini-commerce/build-evidence/finalize-before.log

      - name: Static integrity, mappings, JSON, YAML and AI Eval
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install 'PyYAML==6.0.2'
            python tools/generate_complete_mini_commerce_v2.py --check
            python mini-commerce/tools/check_learning_references.py
            python mini-commerce/ai-engineering/eval/run_static_eval.py
            python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('mini-commerce').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('valid-json', path)
          for pattern in ('*.yml', '*.yaml'):
              for path in Path('mini-commerce').rglob(pattern):
                  list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
                  print('valid-yaml', path)
          PY
          } 2>&1 | tee mini-commerce/build-evidence/static.log

      - name: MCP SDK construction, security and tool-contract tests
        shell: bash
        working-directory: mini-commerce/mcp-server
        run: |
          set -o pipefail
          {
            python -m pip install -e '.[dev]'
            pytest -q
          } 2>&1 | tee ../build-evidence/mcp.log

      - name: Java compile, unit, architecture and PostgreSQL integration tests
        shell: bash
        working-directory: mini-commerce/backend
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee ../build-evidence/maven.log

      - name: Validate Compose and build runtime images
        shell: bash
        run: |
          set -o pipefail
          {
            docker compose -f mini-commerce/compose.yaml config >mini-commerce/build-evidence/compose-rendered.yml
            docker build -t mini-commerce-backend:${GITHUB_SHA} mini-commerce/backend
            docker build -t mini-commerce-mcp:${GITHUB_SHA} mini-commerce/mcp-server
          } 2>&1 | tee mini-commerce/build-evidence/containers.log

      - name: Start complete topology and run API plus MCP smoke tests
        shell: bash
        run: |
          set -o pipefail
          COMPOSE='docker compose -f mini-commerce/compose.yaml --profile app'
          set +e
          (
            set -e
            $COMPOSE up -d --build
            timeout 300 bash -c 'until curl -fsS http://localhost:18088/actuator/health/readiness >/dev/null; do sleep 3; done'
            BASE_URL=http://localhost:18088 bash mini-commerce/scripts/smoke.sh
            $COMPOSE ps --status running --services | grep -qx backend
            $COMPOSE ps --status running --services | grep -qx gateway
            $COMPOSE ps --status running --services | grep -qx mcp-server
            timeout 120 bash -c 'until test "$(curl -s -o /tmp/mcp-response -w "%{http_code}" http://localhost:18081/mcp)" = 401; do sleep 2; done'
          ) 2>&1 | tee mini-commerce/build-evidence/runtime-smoke.log
          rc=${PIPESTATUS[0]}
          $COMPOSE logs --no-color >mini-commerce/build-evidence/compose-logs.txt 2>&1 || true
          $COMPOSE down -v --remove-orphans >>mini-commerce/build-evidence/runtime-smoke.log 2>&1 || true
          exit $rc

      - name: AWS Terraform formatting and validation
        shell: bash
        working-directory: mini-commerce/infra/aws/terraform
        run: |
          set -o pipefail
          {
            terraform fmt -check -recursive
            terraform init -backend=false
            terraform validate
          } 2>&1 | tee ../../../build-evidence/terraform.log

      - name: Record successful validation and rebuild final stable manifests
        run: |
          find mini-commerce -type d \( -name __pycache__ -o -name .pytest_cache -o -name .terraform \) -prune -exec rm -rf {} + || true
          rm -f mini-commerce/CI-FAILURE-*.md
          cat > mini-commerce/VALIDATION-REPORT.md <<EOF
          # 完整工程验证报告

          本报告由默认分支工作流 \`bootstrap-complete-mini-commerce-v8\` 生成，并与源码位于同一提交。

          - Workflow：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 输入提交：${GITHUB_SHA}
          - Java 21 + Maven compile/unit/ArchUnit/Jacoco：通过
          - Testcontainers PostgreSQL 18 + Flyway + 事务/库存并发/HTTP 对象权限测试：通过
          - MCP SDK 2.1.1 构造 + 路径/SQL/命令白名单/Prompt Injection 测试：通过
          - Docker Compose 解析及后端/MCP 镜像构建：通过
          - 完整 Compose 启动 + Nginx 登录/商品/下单/订单读取 Smoke：通过
          - MCP HTTP 匿名请求返回 401，Bearer 边界生效：通过
          - Terraform fmt/init/validate：通过
          - 文档章节映射、JSON、YAML 与 AI 静态 Eval：通过

          只有以上步骤全部成功，工作流才执行后续的 \`main\` 快进。
          EOF
          python tools/finalize_delivery_v7.py | tee mini-commerce/build-evidence/finalize-after.log

      - name: Commit the exact validated repository to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md MANIFEST.md mini-commerce .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish complete runtime-validated Mini Commerce learning repository'
          fi
          git push origin HEAD:feat/complete-mini-commerce

      - name: Fast-forward main only after every gate succeeds
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Persist failure evidence to feature branch only
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p mini-commerce/build-evidence
          {
            echo '# CI 失败报告（完整工程未发布到 main）'
            echo
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo '- 结论：至少一个门禁失败；main 快进步骤未执行。'
            for file in mini-commerce/build-evidence/*.log mini-commerce/build-evidence/*.txt; do
              if test -f "$file"; then
                echo
                echo "## $(basename "$file") 最后 250 行"
                echo '```text'
                tail -n 250 "$file"
                echo '```'
              fi
            done
          } > mini-commerce/CI-FAILURE-bootstrap-v8.md
          git add -f mini-commerce/CI-FAILURE-bootstrap-v8.md
          git commit -m 'ci: record failed isolated final validation' || true
          git pull --rebase origin feat/complete-mini-commerce || true
          git push origin HEAD:feat/complete-mini-commerce || true

      - name: Upload all validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-commerce-v8-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            mini-commerce/VALIDATION-REPORT.md
            mini-commerce/CI-FAILURE-bootstrap-v8.md
            mini-commerce/build-evidence/**
            mini-commerce/backend/target/surefire-reports/**
            mini-commerce/backend/target/failsafe-reports/**
            mini-commerce/backend/target/site/jacoco/**
